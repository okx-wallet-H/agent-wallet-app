version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: agentwallet-db
    environment:
      POSTGRES_DB: agentwallet
      POSTGRES_USER: agentwallet
      POSTGRES_PASSWORD: agentwallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentwallet"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentwallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: agentwallet-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/agentwallet
      - DB_USER=agentwallet
      - DB_PASSWORD=agentwallet
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === AI Trader Containers (independent per strategy) ===
  trader-solana-sniper:
    build: { context: ./backend, dockerfile: Dockerfile.prod }
    container_name: trader-solana-sniper
    env_file: .env
    command: ["java", "-cp", "app.jar", "com.agentwallet.TraderMainKt", "solana-sniper"]
    volumes: ["./trader-knowledge:/opt/trader-knowledge"]
    restart: unless-stopped

  trader-smart-money:
    build: { context: ./backend, dockerfile: Dockerfile.prod }
    container_name: trader-smart-money
    env_file: .env
    command: ["java", "-cp", "app.jar", "com.agentwallet.TraderMainKt", "smart-money"]
    volumes: ["./trader-knowledge:/opt/trader-knowledge"]
    restart: unless-stopped

  trader-kol-radar:
    build: { context: ./backend, dockerfile: Dockerfile.prod }
    container_name: trader-kol-radar
    env_file: .env
    command: ["java", "-cp", "app.jar", "com.agentwallet.TraderMainKt", "kol-radar"]
    volumes: ["./trader-knowledge:/opt/trader-knowledge"]
    restart: unless-stopped

  trader-whale-watcher:
    build: { context: ./backend, dockerfile: Dockerfile.prod }
    container_name: trader-whale-watcher
    env_file: .env
    command: ["java", "-cp", "app.jar", "com.agentwallet.TraderMainKt", "whale-watcher"]
    volumes: ["./trader-knowledge:/opt/trader-knowledge"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
