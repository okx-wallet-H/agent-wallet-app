version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: agentwallet-db
    environment:
      POSTGRES_DB: agentwallet
      POSTGRES_USER: agentwallet
      POSTGRES_PASSWORD: agentwallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentwallet"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentwallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
